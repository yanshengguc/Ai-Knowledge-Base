# 注意:不在这里 include local(否则 prod 部署也会加载 application-local.properties 里的真实 key)。
# 本地开发:bash scripts/run-dev.sh(显式 --spring.profiles.active=local)
# 测试类:各自 @ActiveProfiles("local")
spring.application.name=Ai-Knowledge-Base
spring.datasource.url=jdbc:mysql://localhost:3306/ai_knowledge_base
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 生产/演示环境不打印 SQL(StdOutImpl 全量刷 stdout,批量入库时会拖慢性能;排查时用 logback 按级别开)
spring.data.redis.database=0
aliyun.oss.endpoint=oss-cn-guangzhou.aliyuncs.com
aliyun.oss.bucket-name=yan-ai-knowledge-base
aliyun.oss.access-key-id=${OSS_ACCESS_KEY_ID:}
aliyun.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
retrieval.top-k=5
# 实测校准(8/20):相关 0.42 vs 无关 0.53+,0.35 过严会把相关结果全过滤
retrieval.similarity-threshold=0.5
# Agent Loop 死循环防护:工具调用最大轮数
agent.max-steps=5
# 向量化批大小:批量接口一次请求处理一批,减少网络往返
indexing.batch-size=20
# 文本切片:滑动窗口大小与相邻片段重叠(RAG 召回质量的两个关键参数)
# 切片策略:structure(默认,按 Markdown 标题/段落/句子边界,chunk 前置章节标题)/ simple(固定窗口)
splitter.mode=structure
splitter.chunk-size=500
splitter.overlap=100
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY:}
spring.ai.dashscope.embedding.options.model=text-embedding-v3
dashvector.api-key=${DASHVECTOR_API_KEY:}
dashvector.endpoint=${DASHVECTOR_ENDPOINT:}
# 长期记忆治理(remember 写入前单点执行:一次向量查询同时做去重/过期/容量淘汰)
memory.governance.enabled=true
# 语义去重:与新记忆最相似的一条 score 超过该阈值则跳过写入
memory.governance.dedup-threshold=0.92
# 单用户记忆容量上限:超出后按 created_at 滚动淘汰最旧一条
memory.governance.max-per-user=500
# 记忆保留天数:超过后过期清理
memory.governance.retention-days=180
# 单条记忆长度上限:存储层兜底截断(摘要压缩)
memory.governance.content-max-length=200
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-v4-flash
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
# JWT 签名密钥(安全加固:环境变量注入,不入库明文)
jwt.secret-key=${JWT_SECRET_KEY}

# Actuator 可观测性:仅暴露健康检查(避免泄露内部信息)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# MCP Server(Streamable HTTP):把知识库工具暴露为标准协议,任何 MCP Client 可调
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.annotation-scanner.enabled=true
spring.ai.mcp.server.streamable-http.mcp-endpoint=/api/mcp-endpoint
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.name=ai-knowledge-base-mcp

# 重排 API(默认硅基流动,国内直连免费模型;key 在 local 配置)
rerank.endpoint=https://api.siliconflow.cn/v1/rerank
rerank.model=BAAI/bge-reranker-v2-m3
rerank.api-key=${SILICONFLOW_API_KEY:}

# Token 计价(元/百万tokens,估算用):V4-Flash 空闲档/缓存未命中口径,高峰档约 x2,按官网校准
token-cost.models.deepseek-v4-flash.input-per-m=1.5
token-cost.models.deepseek-v4-flash.output-per-m=4.5
token-cost.models.text-embedding-v3.input-per-m=0.5
token-cost.models.text-embedding-v3.output-per-m=0

# 注册开关(生产可关闭,防陌生人注册;关闭后已有账号登录不受影响)
# 生产经 /etc/aikb/aikb.env 设 REGISTER_ENABLED=false 覆盖
register.enabled=${REGISTER_ENABLED:true}
