spring.profiles.include=local

spring.application.name=Ai-Knowledge-Base
spring.datasource.url=jdbc:mysql://localhost:3306/ai_knowledge_base
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
spring.data.redis.database=0
aliyun.oss.endpoint=oss-cn-guangzhou.aliyuncs.com
aliyun.oss.bucket-name=yan-ai-knowledge-base
aliyun.oss.access-key-id=${OSS_ACCESS_KEY_ID:}
aliyun.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
retrieval.top-k=5
retrieval.similarity-threshold=0.35
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY:}
spring.ai.dashscope.embedding.options.model=text-embedding-v3
dashvector.api-key=${DASHVECTOR_API_KEY:}
dashvector.endpoint=${DASHVECTOR_ENDPOINT:}
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-v4-flash
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
# JWT 签名密钥(安全加固:环境变量注入,不入库明文)
jwt.secret-key=${JWT_SECRET_KEY}

# Actuator 可观测性:仅暴露健康检查(避免泄露内部信息)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
