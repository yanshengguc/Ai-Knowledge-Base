# ============================================================
# 生产环境配置(部署用,优先级高于 application.properties)
# 敏感项全部走环境变量;主配置已有 ${ENV:默认} 兜底,这里只覆盖部署相关差异项
# 部署时必须设置:DASHSCOPE_API_KEY / DASHVECTOR_API_KEY / DASHVECTOR_ENDPOINT /
#                DEEPSEEK_API_KEY / JWT_SECRET_KEY / DB_PASSWORD / OSS_ACCESS_KEY_ID /
#                OSS_ACCESS_KEY_SECRET / SILICONFLOW_API_KEY(重排可选)
# ============================================================

# 端口(容器/服务器)
server.port=${SERVER_PORT:8080}

# 数据库(容器内可用 mysql:3306,服务器直连用公网地址)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_knowledge_base}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Redis(容器内可用 redis:6379)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# 聊天 SSE 超时(毫秒,长回答调大)
chat.sse-timeout-ms=${SSE_TIMEOUT_MS:300000}

# 日志:生产保持 INFO,不打印 SQL
logging.level.root=INFO
